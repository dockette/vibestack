name: "Docker"

on:
  workflow_dispatch:

  push:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Builds into the local Docker daemon, so no export or import step
      - name: Build image
        run: make build

      - name: Smoke test image
        run: make test

  publish:
    name: "Publish"
    needs: build
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/vibestack"
      tag: "latest"
      context: "."
      platforms: "linux/amd64,linux/arm64"
      push: true

  docs:
    name: "Docs"
    needs: publish
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/vibestack"
